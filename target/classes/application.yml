server:
  port: 8080

spring:
  application:
    name: user-role-permission-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pro24_group9db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
  bootstrap:
    admin:
      username: ${ADMIN_USERNAME:}
      password: ${ADMIN_PASSWORD:}
      nick-name: ${ADMIN_NICK_NAME:Administrator}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
